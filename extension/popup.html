<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Dzen Analytics</title>
  <style>
    body { width: 340px; padding: 16px; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: #1c1c1e; color: #fff; margin: 0; }
    h3 { margin-top: 0; color: #a855f7; display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
    .tabs { display: flex; gap: 5px; margin-bottom: 15px; border-bottom: 1px solid #333; padding-bottom: 5px; }
    .tab { background: none; border: none; color: #9ca3af; cursor: pointer; padding: 5px 10px; font-size: 13px; font-weight: bold; border-radius: 4px; }
    .tab.active { background: #374151; color: white; }
    .tab-content { display: none; }
    .tab-content.active { display: block; }

    label { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; font-size: 14px; cursor: pointer; }
    input[type="checkbox"] { cursor: pointer; }
    input[type="text"], textarea { width: 100%; box-sizing: border-box; background: #374151; border: 1px solid #4b5563; color: white; padding: 8px; margin-top: 4px; margin-bottom: 10px; border-radius: 4px; font-size: 13px; }

    .progress-container { margin-top: 15px; margin-bottom: 15px; background: #374151; border-radius: 8px; overflow: hidden; height: 12px; position: relative; }
    .progress-bar { background: linear-gradient(90deg, #9333ea 0%, #d8b4fe 100%); height: 100%; width: 0%; transition: width 0.3s; }
    .progress-text { font-size: 12px; color: #d1d5db; display: flex; justify-content: space-between; margin-bottom: 5px; }

    button.primary { width: 100%; padding: 10px; background: #9333ea; border: none; color: white; border-radius: 6px; font-weight: bold; cursor: pointer; transition: background-color 0.2s; font-size: 14px; margin-top: 10px; }
    button.primary:hover { background: #7e22ce; }
  </style>
</head>
<body>
  <h3>🔮 Dzen Viral Analytics</h3>

  <div class="progress-text">
    <span>Часы вовлеченного просмотра</span>
    <span id="watch-hours-text">0 / 30ч</span>
  </div>
  <div class="progress-container">
    <div class="progress-bar" id="watch-hours-bar"></div>
  </div>

  <div class="tabs">
    <button class="tab active" data-target="tab-protection">Защита</button>
    <button class="tab" data-target="tab-automation">Автоматизация</button>
    <button class="tab" data-target="tab-ab">A/B тест</button>
  </div>

  <div id="tab-protection" class="tab-content active">
    <label>
      <input type="checkbox" id="chk-noindex" checked>
      Детектор теневого бана (noindex)
    </label>
    <label>
      <input type="checkbox" id="chk-erid" checked>
      ERID-контроль публикаций
    </label>
  </div>

  <div id="tab-automation" class="tab-content">
    <div style="font-size: 13px; margin-bottom: 5px; color: #d1d5db;">Ссылки на статьи (каждая с новой строки):</div>
    <textarea id="bulk-urls" rows="4" placeholder="https://dzen.ru/profile/editor/..."></textarea>

    <div style="font-size: 13px; margin-bottom: 5px; color: #d1d5db;">Найти текст:</div>
    <input type="text" id="bulk-old" placeholder="Старый текст">

    <div style="font-size: 13px; margin-bottom: 5px; color: #d1d5db;">Заменить на:</div>
    <input type="text" id="bulk-new" placeholder="Новый текст">

    <button id="btn-start-bulk" class="primary">Старт замены</button>
  </div>

  <div id="tab-ab" class="tab-content">
    <div style="font-size: 13px; margin-bottom: 5px; color: #d1d5db;">Заголовок 1:</div>
    <input type="text" id="ab-title1" placeholder="Вариант A">

    <div style="font-size: 13px; margin-bottom: 5px; color: #d1d5db;">Заголовок 2:</div>
    <input type="text" id="ab-title2" placeholder="Вариант B">

    <button id="btn-save-ab" class="primary">Сохранить для A/B</button>
  </div>

  <button id="dashboard-btn" class="primary" style="background:#111827; border:1px solid #374151; margin-top:20px;">Открыть веб-панель 📊</button>

  <script src="popup.js"></script>
</body>
</html>
